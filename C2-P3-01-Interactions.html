<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaf Cross-Section — Light (Dark)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@300;400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f0a;font-family:'Source Sans 3',sans-serif;color:#e0e8d8;overflow:hidden;height:100vh;width:100vw}
  #canvas-container{width:100%;height:100%;position:relative}
  canvas{display:block}
  #overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
  .title-block{position:absolute;top:20px;left:28px}
  .title-block h1{font-family:'Playfair Display',serif;font-size:26px;color:#b8e986;letter-spacing:0.5px;text-shadow:0 2px 12px rgba(100,180,50,0.3)}
  .title-block p{font-size:13px;color:#8a9a78;margin-top:3px;font-weight:400}
  .legend{position:absolute;bottom:22px;left:28px;display:flex;flex-direction:column;gap:7px}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:400;color:#ccc}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)}
  .controls-hint{position:absolute;bottom:22px;right:28px;font-size:11px;color:#5a6a4e;text-align:right;line-height:1.5}
</style>
</head>
<body>
<div id="canvas-container">
  <div id="overlay">
    <div class="title-block"><h1>Leaf Cross-Section</h1><p>Light interaction with internal leaf anatomy</p></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#ffe066"></div><span>Incoming sunlight</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff6644"></div><span>Specular reflection (αᵢ = αᵣ)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#bb77ff"></div><span>Diffuse reflection &amp; transmission (Lambertian)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#44bbff"></div><span>Refraction</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#66dd66"></div><span>Internal scattering</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff4466"></div><span>Absorption</span></div>
    </div>
    <div class="controls-hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══ THEME CONFIG ═══
const THEME={
  bg:0x0a0f0a,
  ambientInt:0.35, dirInt:0.9, dir2Int:0.4, dir3Int:0.25,
  normal:'#dddddd', normalHex:0xdddddd,
  labelShadow:'rgba(0,0,0,0.95)',
  sun:0xffdd33, sunLabel:'#ffdd33',
  spec:0xff5533, specLabel:'#ff6644',
  diffuse:0xaa55ff, diffLabel:'#bb77ff', diffLabel2:'#9966cc',
  scatter:0x66dd66, refract:0x44bbff, absorb:0xff4466,
  lobe:0xbb77ff,
  cuticle:0x334422, upperEpi:0x5a8a30, palisade:0x2d6e1e, chloro:0x88cc22,
  spongy:0x6aad3a, air:0xd4eec4, lowerEpi:0x4a7a28, vein:0xc4a840,
  layerColors:['#7a9a60','#7aaa50','#4da030','#6abc50','#5a9a38'],
};
buildScene(THEME);

function buildScene(T){
const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(T.bg);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,T.ambientInt));
var tmp;
tmp=new THREE.DirectionalLight(0xffffff,T.dirInt);tmp.position.set(-8,18,10);tmp.castShadow=true;scene.add(tmp);
tmp=new THREE.DirectionalLight(0xffffff,T.dir2Int);tmp.position.set(8,10,-8);scene.add(tmp);
tmp=new THREE.DirectionalLight(0xffffff,T.dir3Int);tmp.position.set(0,-8,0);scene.add(tmp);

const cuticleMat=new THREE.MeshPhysicalMaterial({color:T.cuticle,roughness:0.2,clearcoat:0.8,clearcoatRoughness:0.1,transparent:true,opacity:0.6,side:THREE.DoubleSide});
const upperEpiMat=new THREE.MeshPhysicalMaterial({color:T.upperEpi,roughness:0.4,transparent:true,opacity:0.9});
const palisadeMat=new THREE.MeshPhysicalMaterial({color:T.palisade,roughness:0.5,transparent:true,opacity:0.92});
const chloroMat=new THREE.MeshPhysicalMaterial({color:T.chloro,roughness:0.3,emissive:0x1a2a00,emissiveIntensity:0.15});
const spongyMat=new THREE.MeshPhysicalMaterial({color:T.spongy,roughness:0.55,transparent:true,opacity:0.88});
const airMat=new THREE.MeshPhysicalMaterial({color:T.air,roughness:0.9,transparent:true,opacity:0.1});
const lowerEpiMat=new THREE.MeshPhysicalMaterial({color:T.lowerEpi,roughness:0.45,transparent:true,opacity:0.9});
const veinMat=new THREE.MeshPhysicalMaterial({color:T.vein,roughness:0.4,metalness:0.05});

const leafGroup=new THREE.Group();scene.add(leafGroup);
const LW=20,LD=10,SURFACE_Y=5.6,BOTTOM_Y=-0.55;
const UP=new THREE.Vector3(0,1,0);

function createArrow(start,end,color,sr,hr,hl){
  sr=sr||0.05;hr=hr||0.16;hl=hl||0.45;
  const g=new THREE.Group(),d=new THREE.Vector3().subVectors(end,start),tl=d.length();
  if(tl<0.01)return g;
  const sl=Math.max(0.01,tl-hl),dn=d.clone().normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dn);
  const m=new THREE.MeshBasicMaterial({color});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(sr,sr,sl,8),m);
  shaft.position.copy(start).add(dn.clone().multiplyScalar(sl/2));shaft.quaternion.copy(q);g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(hr,hl,10),m.clone());
  head.position.copy(start).add(dn.clone().multiplyScalar(sl+hl/2));head.quaternion.copy(q);g.add(head);
  return g;
}
function createFadingArrow(start,end,color){
  const g=new THREE.Group(),d=new THREE.Vector3().subVectors(end,start),tl=d.length();
  if(tl<0.01)return g;
  const dn=d.clone().normalize(),q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dn);
  for(let i=0;i<6;i++){const t0=i/6,t1=(i+1)/6,p0=start.clone().lerp(end,t0),p1=start.clone().lerp(end,t1);
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.045*(1-t1*0.55),0.045*(1-t1*0.55),p0.distanceTo(p1),6),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:1-t1*0.85}));
    seg.position.copy(p0).add(p1).multiplyScalar(0.5);seg.quaternion.copy(q);g.add(seg);}
  const xMat=new THREE.MeshBasicMaterial({color:T.absorb});
  for(let r=0;r<2;r++){const xm=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.08,0.08),xMat);xm.position.copy(end);xm.rotation.z=r===0?Math.PI/4:-Math.PI/4;g.add(xm);}
  return g;
}

// ═══ LEAF ANATOMY ═══
var _m;
_m=new THREE.Mesh(new THREE.BoxGeometry(LW,0.15,LD),cuticleMat);_m.position.set(0,5.5,0);leafGroup.add(_m);
_m=new THREE.Mesh(new THREE.BoxGeometry(LW,0.6,LD),upperEpiMat);_m.position.set(0,5.1,0);leafGroup.add(_m);
for(let x=-9;x<=9;x+=1.2)for(let z=-4;z<=4;z+=1.2){const c=new THREE.Mesh(new THREE.SphereGeometry(0.55,8,6,0,Math.PI*2,0,Math.PI/2),upperEpiMat);c.position.set(x+Math.random()*0.3,5.4,z+Math.random()*0.3);c.scale.y=0.4;leafGroup.add(c);}
for(let x=-9;x<=9;x+=1.1)for(let z=-4;z<=4;z+=1.1){const h=2.8+Math.random()*0.6,r=0.35+Math.random()*0.1;const cell=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.9,h,8),palisadeMat);const px=x+Math.random()*0.4-0.2,pz=z+Math.random()*0.4-0.2;cell.position.set(px,4.8-h/2-0.3,pz);cell.castShadow=true;leafGroup.add(cell);for(let c=0;c<2+Math.floor(Math.random()*3);c++){const cm=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,4),chloroMat);const a=Math.random()*Math.PI*2;cm.position.set(px+Math.cos(a)*r*0.6,cell.position.y+(Math.random()-0.5)*h*0.7,pz+Math.sin(a)*r*0.6);cm.scale.set(1,0.5,1);leafGroup.add(cm);}}
for(let x=-9;x<=9;x+=2.5)for(let z=-4;z<=4;z+=2.5){for(let y=0.1;y<=2.8;y+=1.5){if(Math.random()>0.35){const r=0.45+Math.random()*0.35;const cell=new THREE.Mesh(new THREE.SphereGeometry(r,7,5),spongyMat);cell.position.set(x+(Math.random()-0.5)*1.8,y+(Math.random()-0.5)*0.7,z+(Math.random()-0.5)*1.8);cell.scale.set(1+Math.random()*0.5,0.6+Math.random()*0.4,1+Math.random()*0.5);leafGroup.add(cell);if(Math.random()>0.5){const cm=new THREE.Mesh(new THREE.SphereGeometry(0.09,5,4),chloroMat);cm.position.copy(cell.position);cm.position.x+=(Math.random()-0.5)*r*0.5;cm.scale.set(1,0.5,1);leafGroup.add(cm);}}}if(Math.random()>0.4){const am=new THREE.Mesh(new THREE.SphereGeometry(0.5+Math.random()*0.4,6,4),airMat);am.position.set(x+(Math.random()-0.5)*1.5,0.1+Math.random()*2.7,z+(Math.random()-0.5)*1.5);leafGroup.add(am);}}
const vp=new THREE.CatmullRomCurve3([new THREE.Vector3(-10,1.5,0),new THREE.Vector3(-4,1.3,0.5),new THREE.Vector3(0,1.2,0),new THREE.Vector3(4,1.3,-0.3),new THREE.Vector3(10,1.5,0)]);leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(vp,32,0.35,8,false),veinMat));for(let i=0;i<4;i++){const t=0.2+i*0.2,pt=vp.getPoint(t),d=i%2===0?1:-1;leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([pt,new THREE.Vector3(pt.x+1,pt.y+0.2,pt.z+d*2),new THREE.Vector3(pt.x+2,pt.y+0.3,pt.z+d*4)]),12,0.15,6,false),veinMat));}
_m=new THREE.Mesh(new THREE.BoxGeometry(LW,0.5,LD),lowerEpiMat);_m.position.set(0,-0.2,0);leafGroup.add(_m);
for(let i=0;i<10;i++){const sx=-8+Math.random()*16,sz=-3.5+Math.random()*7;for(let side=-1;side<=1;side+=2){const g=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.08,6,12,Math.PI),new THREE.MeshPhysicalMaterial({color:0x3a7a20,roughness:0.4}));g.position.set(sx,-0.5,sz);g.rotation.x=Math.PI/2;g.rotation.z=side>0?0:Math.PI;g.scale.set(1,1,0.6);leafGroup.add(g);}}
_m=new THREE.Mesh(new THREE.BoxGeometry(LW,0.1,LD),cuticleMat);_m.position.set(0,BOTTOM_Y,0);leafGroup.add(_m);

// Sun
const sunPos=new THREE.Vector3(-14,16,0);
_m=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,16),new THREE.MeshBasicMaterial({color:T.sun}));_m.position.copy(sunPos);leafGroup.add(_m);
const sr2=new THREE.Mesh(new THREE.RingGeometry(1.0,1.5,24),new THREE.MeshBasicMaterial({color:T.sun,transparent:true,opacity:0.25,side:THREE.DoubleSide}));sr2.position.copy(sunPos);leafGroup.add(sr2);

// ═══ SPECULAR REFLECTION ~41° ═══
const specHit=new THREE.Vector3(-5,SURFACE_Y,0);
const incDir=specHit.clone().sub(sunPos).normalize();
leafGroup.add(createArrow(sunPos.clone().add(incDir.clone().multiplyScalar(1.5)),specHit,T.sun,0.06,0.22,0.6));
const refDir=incDir.clone().sub(UP.clone().multiplyScalar(2*incDir.dot(UP))).normalize();
const refEnd=specHit.clone().add(refDir.clone().multiplyScalar(8));
leafGroup.add(createArrow(specHit,refEnd,T.spec,0.06,0.22,0.6));

// Normal
const nLen=7.5,nEnd=specHit.clone().add(UP.clone().multiplyScalar(nLen));
(function(){const pts=[];for(let i=0;i<=60;i++)pts.push(specHit.clone().lerp(nEnd,i/60));
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:T.normalHex,dashSize:0.4,gapSize:0.2,transparent:true,opacity:0.8}));l.computeLineDistances();leafGroup.add(l);})();
leafGroup.add(createArrow(specHit.clone().add(UP.clone().multiplyScalar(nLen-0.8)),nEnd,T.normalHex,0.035,0.14,0.55));

// Angle arcs
const incAngle=Math.acos(Math.abs(incDir.dot(UP))),arcR=4.0;
function makeArcPts(c,sw,dir,n){const p=[];for(let i=0;i<=n;i++){const f=i/n,a=Math.PI/2+dir*f*sw;p.push(new THREE.Vector3(c.x-Math.cos(a)*arcR,c.y+Math.sin(a)*arcR,c.z));}return p;}
const iac=new THREE.CatmullRomCurve3(makeArcPts(specHit,incAngle,1,50));
leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(iac,50,0.07,5,false),new THREE.MeshBasicMaterial({color:T.sun})));
const rac=new THREE.CatmullRomCurve3(makeArcPts(specHit,incAngle,-1,50));
leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(rac,50,0.07,5,false),new THREE.MeshBasicMaterial({color:T.spec})));

// α labels (instead of θ)
function makeCleanLabel(text,pos,color,fontSize){
  fontSize=fontSize||80;const cv=document.createElement('canvas'),cx=cv.getContext('2d');
  cv.width=256;cv.height=128;cx.clearRect(0,0,256,128);
  cx.shadowColor=T.labelShadow;cx.shadowBlur=14;
  cx.font='bold '+fontSize+'px serif';cx.fillStyle=color;cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(text,128,64);cx.fillText(text,128,64);cx.fillText(text,128,64);cx.shadowBlur=0;cx.fillText(text,128,64);
  const t2=new THREE.CanvasTexture(cv);t2.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t2,transparent:true,depthTest:false}));
  s.position.copy(pos);s.scale.set(3.5,1.75,1);return s;
}
const im=iac.getPoint(0.5),rm=rac.getPoint(0.5);
leafGroup.add(makeCleanLabel('αᵢ',new THREE.Vector3(im.x-2,im.y+0.3,im.z),T.sunLabel,90));
leafGroup.add(makeCleanLabel('αᵣ',new THREE.Vector3(rm.x+2,rm.y+0.3,rm.z),T.specLabel,90));
leafGroup.add(makeCleanLabel('n̂',new THREE.Vector3(specHit.x+0.8,nEnd.y+1,specHit.z),T.normal,75));

// ═══ LAMBERTIAN DIFFUSE ═══
const dh=new THREE.Vector3(6,SURFACE_Y,0);
[new THREE.Vector3(5,SURFACE_Y,-1),dh,new THREE.Vector3(7,SURFACE_Y,1)].forEach(h=>{const td=h.clone().sub(sunPos).normalize();leafGroup.add(createArrow(sunPos.clone().add(td.clone().multiplyScalar(1.5)),h,T.sun,0.055,0.2,0.55));});
(function(){const o=dh,ta=new THREE.Vector3(1,0,0),bi=new THREE.Vector3(0,0,1),ml=6.5;
  [[0,[0]],[Math.asin(Math.sqrt(0.15)),[0,Math.PI/2,Math.PI,Math.PI*1.5]],[Math.asin(Math.sqrt(0.4)),[Math.PI/4,Math.PI*3/4,Math.PI*5/4,Math.PI*7/4]],[Math.asin(Math.sqrt(0.7)),[0,Math.PI/3,Math.PI*2/3,Math.PI,Math.PI*4/3,Math.PI*5/3]],[Math.asin(Math.sqrt(0.92)),[Math.PI/6,Math.PI/2,Math.PI*5/6,Math.PI*7/6,Math.PI*3/2,Math.PI*11/6]]].forEach(([th,phs])=>{phs.forEach(ph=>{const dr=new THREE.Vector3().addScaledVector(UP,Math.cos(th)).addScaledVector(ta,Math.sin(th)*Math.cos(ph)).addScaledVector(bi,Math.sin(th)*Math.sin(ph)).normalize();const en=o.clone().add(dr.clone().multiplyScalar(ml*Math.cos(th)));leafGroup.add(createArrow(o,en,T.diffuse,0.03,0.11,0.32));});});
  for(let rot=0;rot<2;rot++){const pts=[];for(let i=0;i<=100;i++){const ang=(i/100)*Math.PI-Math.PI/2,r=Math.cos(ang)*ml,x=r*Math.sin(ang),y=r*Math.cos(ang);if(rot===0)pts.push(new THREE.Vector3(o.x+x,o.y+y,o.z));else pts.push(new THREE.Vector3(o.x,o.y+y,o.z+x));}const cv=new THREE.CatmullRomCurve3(pts);leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(cv,60,0.07,4,false),new THREE.MeshBasicMaterial({color:T.lobe,transparent:true,opacity:0.6})));leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(cv,60,0.18,4,false),new THREE.MeshBasicMaterial({color:T.lobe,transparent:true,opacity:0.1})));}
  for(let j=0;j<6;j++){const u=(j+0.5)/6,t2=Math.asin(Math.sqrt(u)),r=Math.cos(t2)*ml,h=o.y+Math.cos(t2)*Math.cos(t2)*ml;const rg=new THREE.Mesh(new THREE.RingGeometry(r*0.02,r,24),new THREE.MeshBasicMaterial({color:T.lobe,transparent:true,opacity:0.03,side:THREE.DoubleSide}));rg.position.set(o.x,h,o.z);rg.rotation.x=-Math.PI/2;leafGroup.add(rg);}
})();

// Transmission
(function(){const o=new THREE.Vector3(6,BOTTOM_Y,0),dn=new THREE.Vector3(0,-1,0),ta=new THREE.Vector3(1,0,0),bi=new THREE.Vector3(0,0,1),ml=5;
  [[0,[0]],[Math.asin(Math.sqrt(0.15)),[0,Math.PI/2,Math.PI,Math.PI*1.5]],[Math.asin(Math.sqrt(0.45)),[Math.PI/4,Math.PI*3/4,Math.PI*5/4,Math.PI*7/4]],[Math.asin(Math.sqrt(0.75)),[0,Math.PI/3,Math.PI*2/3,Math.PI,Math.PI*4/3,Math.PI*5/3]],[Math.asin(Math.sqrt(0.93)),[Math.PI/6,Math.PI*5/6,Math.PI*7/6,Math.PI*11/6]]].forEach(([th,phs])=>{phs.forEach(ph=>{const dr=new THREE.Vector3().addScaledVector(dn,Math.cos(th)).addScaledVector(ta,Math.sin(th)*Math.cos(ph)).addScaledVector(bi,Math.sin(th)*Math.sin(ph)).normalize();leafGroup.add(createArrow(o,o.clone().add(dr.clone().multiplyScalar(ml*Math.cos(th))),T.diffuse,0.03,0.11,0.32));});});
  for(let rot=0;rot<2;rot++){const pts=[];for(let i=0;i<=100;i++){const ang=(i/100)*Math.PI-Math.PI/2,r=Math.cos(ang)*ml,x=r*Math.sin(ang),y=r*Math.cos(ang);if(rot===0)pts.push(new THREE.Vector3(o.x+x,o.y-y,o.z));else pts.push(new THREE.Vector3(o.x,o.y-y,o.z+x));}const cv=new THREE.CatmullRomCurve3(pts);leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(cv,60,0.07,4,false),new THREE.MeshBasicMaterial({color:T.lobe,transparent:true,opacity:0.6})));leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(cv,60,0.18,4,false),new THREE.MeshBasicMaterial({color:T.lobe,transparent:true,opacity:0.1})));}
})();

// Internal
[[[-5,4.8,0],[-4.2,3.8,0.6]],[[-4.2,3.8,0.6],[-5,3.0,0.2]],[[-5,3.0,0.2],[-4.5,2.0,-0.3]],[[6,4.8,0],[5.3,3.6,-0.4]],[[5.3,3.6,-0.4],[6,2.8,0.3]],[[6,2.8,0.3],[5.5,1.8,0]],[[0,4.5,0],[0.6,3.5,0.5]],[[0.6,3.5,0.5],[-0.2,2.5,0.2]],[[-0.2,2.5,0.2],[0.4,1.5,-0.3]],[[-8,4.8,1.5],[-7.5,3.5,1.2]],[[-7.5,3.5,1.2],[-8,2.5,0.8]],[[7,4.8,-1],[6.5,3.5,-0.5]],[[6.5,3.5,-0.5],[7,2.3,0]]].forEach(([s,e])=>{leafGroup.add(createArrow(new THREE.Vector3(...s),new THREE.Vector3(...e),T.scatter,0.03,0.1,0.28));});
[[-4.2,3.8,0.6],[-5,3.0,0.2],[5.3,3.6,-0.4],[6,2.8,0.3],[0.6,3.5,0.5],[-0.2,2.5,0.2]].forEach(p=>{const d=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6),new THREE.MeshBasicMaterial({color:T.scatter}));d.position.set(...p);leafGroup.add(d);});
[{i:[[-2,4.8,1],[-2,4.2,1]],o:[[-1.7,4.2,1],[-1.3,3.3,0.8]]},{i:[[2,3.2,-0.5],[2,2.8,-0.5]],o:[[2.3,2.8,-0.5],[2.8,2.2,-0.3]]},{i:[[-4,2.5,0.5],[-4,2.0,0.5]],o:[[-3.6,2.0,0.5],[-3.2,1.3,0.3]]},{i:[[4,3.5,-1.5],[4,3.0,-1.5]],o:[[4.3,3.0,-1.5],[4.6,2.2,-1.2]]}].forEach(({i:inp,o:out})=>{leafGroup.add(createArrow(new THREE.Vector3(...inp[0]),new THREE.Vector3(...inp[1]),T.refract,0.035,0.1,0.25));leafGroup.add(createArrow(new THREE.Vector3(...out[0]),new THREE.Vector3(...out[1]),T.refract,0.035,0.1,0.25));const bd=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),new THREE.MeshBasicMaterial({color:T.refract}));bd.position.set(...inp[1]);leafGroup.add(bd);});
[[[-3,4.0,0.5],[-3,3.2,0.5]],[[2.5,3.8,-0.3],[2.5,3.0,-0.3]],[[5,2.5,0.5],[5,1.8,0.5]],[[-5,3.5,1],[-5,2.8,1]],[[0,2.0,0],[0,1.3,0]]].forEach(([s,e])=>{leafGroup.add(createFadingArrow(new THREE.Vector3(...s),new THREE.Vector3(...e),T.absorb));});

// Labels
function makeLabel(text,pos,color,fontSize){fontSize=fontSize||72;const cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=1024;cv.height=192;cx.clearRect(0,0,1024,192);cx.shadowColor=T.labelShadow;cx.shadowBlur=10;cx.font='bold '+fontSize+'px "Segoe UI", sans-serif';cx.fillStyle=color||'#222';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(text,512,96);cx.shadowBlur=0;cx.fillText(text,512,96);const t2=new THREE.CanvasTexture(cv);t2.minFilter=THREE.LinearFilter;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t2,transparent:true,depthTest:false}));s.position.copy(pos);s.scale.set(12,2.4,1);return s;}

leafGroup.add(makeLabel('Cuticle',new THREE.Vector3(14,5.6,0),T.layerColors[0],56));

leafGroup.add(makeLabel('Specular',new THREE.Vector3(-15,13.5,0),T.specLabel,76));
leafGroup.add(makeLabel('Reflection',new THREE.Vector3(-15,11.7,0),T.specLabel,76));
leafGroup.add(makeLabel('Diffuse Reflection',new THREE.Vector3(6,13.5,0),T.diffLabel,76));

leafGroup.add(makeLabel('Transmission',new THREE.Vector3(6,-7,0),T.diffLabel,76));
leafGroup.add(makeLabel('Lambertian',new THREE.Vector3(6,-8.5,0),T.diffLabel2,60));

// Camera controls
let isDown=false,isRight=false,prevX=0,prevY=0,theta=0.5,phi=0.82,radius=44,panX=1,panY=2.5;
function updateCamera(){camera.position.x=radius*Math.sin(phi)*Math.cos(theta)+panX;camera.position.y=radius*Math.cos(phi)+panY;camera.position.z=radius*Math.sin(phi)*Math.sin(theta);camera.lookAt(panX,panY,0);}
updateCamera();
function renderOnce(){renderer.render(scene,camera);}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)isDown=true;if(e.button===2)isRight=true;prevX=e.clientX;prevY=e.clientY;});
renderer.domElement.addEventListener('mousemove',e=>{if(isDown){theta-=(e.clientX-prevX)*0.005;phi=Math.max(0.2,Math.min(Math.PI-0.2,phi+(e.clientY-prevY)*0.005));updateCamera();renderOnce();}if(isRight){panX-=(e.clientX-prevX)*0.03;panY+=(e.clientY-prevY)*0.03;updateCamera();renderOnce();}prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('mouseup',()=>{isDown=false;isRight=false;});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(12,Math.min(70,radius+e.deltaY*0.03));updateCamera();renderOnce();});
let ts=null,tsd=null;
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1)ts={x:e.touches[0].clientX,y:e.touches[0].clientY};else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;tsd=Math.sqrt(dx*dx+dy*dy);}});
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&ts){theta-=(e.touches[0].clientX-ts.x)*0.005;phi=Math.max(0.2,Math.min(Math.PI-0.2,phi+(e.touches[0].clientY-ts.y)*0.005));ts={x:e.touches[0].clientX,y:e.touches[0].clientY};updateCamera();renderOnce();}else if(e.touches.length===2&&tsd){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);radius=Math.max(12,Math.min(70,radius-(d-tsd)*0.05));tsd=d;updateCamera();renderOnce();}},{passive:false});
renderOnce();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);renderOnce();});
}
