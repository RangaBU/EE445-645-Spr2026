<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaf Surface — Specular Reflection Cone (Dark)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@300;400;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f0a;font-family:'Source Sans 3',sans-serif;color:#e0e8d8;overflow:hidden;height:100vh;width:100vw}
  #canvas-container{width:100%;height:100%;position:relative}
  canvas{display:block}
  #overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
  .title-block{position:absolute;top:20px;left:28px}
  .title-block h1{font-family:'Playfair Display',serif;font-size:26px;color:#b8e986;letter-spacing:0.5px;text-shadow:0 2px 12px rgba(100,180,50,0.3)}
  .title-block p{font-size:13px;color:#8a9a78;margin-top:3px;font-weight:400}
  .legend{position:absolute;bottom:22px;left:28px;display:flex;flex-direction:column;gap:7px}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:400;color:#ccc}
  .legend-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.15)}
  .controls-hint{position:absolute;bottom:22px;right:28px;font-size:11px;color:#5a6a4e;text-align:right;line-height:1.5}
</style>
</head>
<body>
<div id="canvas-container">
  <div id="overlay">
    <div class="title-block"><h1>Leaf Surface — Specular Reflection</h1><p>Non-Fresnel specular reflection from rough leaf epidermis with trichomes</p></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#ffe066"></div><span>Incoming sunlight</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff9944"></div><span>Peak specular (αᵢ ≈ αᵣ)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff6644"></div><span>Specular cone (non-Fresnel)</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#44bbff"></div><span>Refraction into leaf</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#66dd66"></div><span>Internal scattering</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff4466"></div><span>Absorption</span></div>
    </div>
    <div class="controls-hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const THEME={
  bg:0x0a0f0a,
  ambientInt:0.35,dirInt:0.9,dir2Int:0.4,dir3Int:0.25,
  normal:'#dddddd',normalHex:0xdddddd,
  labelShadow:'rgba(0,0,0,0.95)',
  sun:0xffdd33,sunLabel:'#ffdd33',
  spec:0xff5533,specLabel:'#ff6644',
  specPeak:0xff9944,specPeakLabel:'#ff9944',
  scatter:0x66dd66,refract:0x44bbff,absorb:0xff4466,
  coneLobe:0xff8855,
  cuticle:0x3a5522,upperEpi:0x4a7a28,palisade:0x2d6e1e,chloro:0x88cc22,
  spongy:0x6aad3a,air:0xd4eec4,lowerEpi:0x4a7a28,vein:0xc4a840,
  layerColors:['#7a9a60','#7aaa50','#4da030','#6abc50','#5a9a38'],
};
buildScene(THEME);

function buildScene(T){
const container=document.getElementById('canvas-container');
const scene=new THREE.Scene();
scene.background=new THREE.Color(T.bg);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,T.ambientInt));
let tmp;
tmp=new THREE.DirectionalLight(0xffffff,T.dirInt);tmp.position.set(-8,18,10);tmp.castShadow=true;scene.add(tmp);
tmp=new THREE.DirectionalLight(0xffffff,T.dir2Int);tmp.position.set(8,10,-8);scene.add(tmp);
tmp=new THREE.DirectionalLight(0xffffff,T.dir3Int);tmp.position.set(0,-8,0);scene.add(tmp);

const leafGroup=new THREE.Group();scene.add(leafGroup);
const LW=20,LD=10;
const UP=new THREE.Vector3(0,1,0);

// ═══ UNDULATING SURFACE HEIGHT FUNCTION ═══
function surfaceY(x,z){
  return 5.6
    +0.25*Math.sin(x*0.28+0.5)*Math.cos(z*0.35)
    +0.15*Math.sin(x*0.55+1.2)*Math.sin(z*0.6+0.8)
    +0.08*Math.cos(x*1.1)*Math.cos(z*0.9+0.3)
    +0.05*Math.sin(x*2.1+z*1.5);
}
function surfaceNormal(x,z){
  const e=0.05;
  const hx=(surfaceY(x+e,z)-surfaceY(x-e,z))/(2*e);
  const hz=(surfaceY(x,z+e)-surfaceY(x,z-e))/(2*e);
  return new THREE.Vector3(-hx,1,-hz).normalize();
}
const SURFACE_Y=5.6,BOTTOM_Y=-0.55;

// ═══ MATERIALS ═══
const cuticleMat=new THREE.MeshPhysicalMaterial({color:T.cuticle,roughness:0.15,clearcoat:1.0,clearcoatRoughness:0.08,transparent:true,opacity:0.55,side:THREE.DoubleSide});
const palisadeMat=new THREE.MeshPhysicalMaterial({color:T.palisade,roughness:0.5,transparent:true,opacity:0.92});
const chloroMat=new THREE.MeshPhysicalMaterial({color:T.chloro,roughness:0.3,emissive:0x1a2a00,emissiveIntensity:0.15});
const spongyMat=new THREE.MeshPhysicalMaterial({color:T.spongy,roughness:0.55,transparent:true,opacity:0.88});
const airMat=new THREE.MeshPhysicalMaterial({color:T.air,roughness:0.9,transparent:true,opacity:0.1});
const veinMat=new THREE.MeshPhysicalMaterial({color:T.vein,roughness:0.4,metalness:0.05});

// ═══ ARROW HELPERS ═══
function createArrow(start,end,color,sr,hr,hl){
  sr=sr||0.05;hr=hr||0.16;hl=hl||0.45;
  const g=new THREE.Group(),d=new THREE.Vector3().subVectors(end,start),tl=d.length();
  if(tl<0.01)return g;
  const sl=Math.max(0.01,tl-hl),dn=d.clone().normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dn);
  const m=new THREE.MeshBasicMaterial({color});
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(sr,sr,sl,8),m);
  shaft.position.copy(start).add(dn.clone().multiplyScalar(sl/2));shaft.quaternion.copy(q);g.add(shaft);
  const head=new THREE.Mesh(new THREE.ConeGeometry(hr,hl,10),m.clone());
  head.position.copy(start).add(dn.clone().multiplyScalar(sl+hl/2));head.quaternion.copy(q);g.add(head);
  return g;
}
function createFadingArrow(start,end,color){
  const g=new THREE.Group(),d=new THREE.Vector3().subVectors(end,start),tl=d.length();
  if(tl<0.01)return g;
  const dn=d.clone().normalize(),q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dn);
  for(let i=0;i<6;i++){const t0=i/6,t1=(i+1)/6,p0=start.clone().lerp(end,t0),p1=start.clone().lerp(end,t1);
    const seg=new THREE.Mesh(new THREE.CylinderGeometry(0.045*(1-t1*0.55),0.045*(1-t1*0.55),p0.distanceTo(p1),6),
      new THREE.MeshBasicMaterial({color,transparent:true,opacity:1-t1*0.85}));
    seg.position.copy(p0).add(p1).multiplyScalar(0.5);seg.quaternion.copy(q);g.add(seg);}
  const xMat=new THREE.MeshBasicMaterial({color:T.absorb});
  for(let r=0;r<2;r++){const xm=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.08,0.08),xMat);xm.position.copy(end);xm.rotation.z=r===0?Math.PI/4:-Math.PI/4;g.add(xm);}
  return g;
}

// ═══ UNDULATING CUTICLE SURFACE (parametric mesh) ═══
(function(){
  const segX=80,segZ=40;
  const geo=new THREE.PlaneGeometry(LW,LD,segX,segZ);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getY(i);
    pos.setXYZ(i,x,surfaceY(x,z),z);
  }
  geo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({
    color:0x3a5a25,roughness:0.12,clearcoat:0.9,clearcoatRoughness:0.06,
    transparent:true,opacity:0.5,side:THREE.DoubleSide
  })));
})();

// ═══ EPIDERMAL CELL PAVEMENT (jigsaw-puzzle cells from SEM) ═══
(function(){
  const cellMat=new THREE.MeshPhysicalMaterial({
    color:0x4a7a2c,roughness:0.35,clearcoat:0.4,transparent:true,opacity:0.7
  });
  for(let x=-9.5;x<=9.5;x+=0.7){
    for(let z=-4.5;z<=4.5;z+=0.7){
      const px=x+(Math.random()-0.5)*0.45;
      const pz=z+(Math.random()-0.5)*0.45;
      const sy=surfaceY(px,pz);
      const r=0.28+Math.random()*0.12;
      const cell=new THREE.Mesh(new THREE.SphereGeometry(r,5,4),cellMat);
      cell.position.set(px,sy+0.03,pz);
      cell.scale.set(1+Math.random()*0.6,0.08+Math.random()*0.04,1+Math.random()*0.6);
      leafGroup.add(cell);
    }
  }
})();

// ═══ UPPER EPIDERMIS LAYER (undulating) ═══
(function(){
  const segX=60,segZ=30;
  const geo=new THREE.PlaneGeometry(LW,LD,segX,segZ);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getY(i);
    pos.setXYZ(i,x,surfaceY(x,z)-0.3,z);
  }
  geo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({
    color:0x4a8030,roughness:0.4,transparent:true,opacity:0.85,side:THREE.DoubleSide
  })));
})();

// ═══ SUBTLE RETICULATE VENATION ═══
(function(){
  const veinSurfMat=new THREE.MeshPhysicalMaterial({color:0x9ac08a,roughness:0.3,clearcoat:0.3,transparent:true,opacity:0.55});
  const veinSubMat=new THREE.MeshPhysicalMaterial({color:0x8ab87a,roughness:0.35,transparent:true,opacity:0.4});
  const veinFineMat=new THREE.MeshPhysicalMaterial({color:0x7aad70,roughness:0.4,transparent:true,opacity:0.25});

  // Midrib
  const midPts=[];
  for(let i=0;i<=40;i++){const x=-10+i*0.5;const z=0.15*Math.sin(x*0.15);midPts.push(new THREE.Vector3(x,surfaceY(x,z)+0.06,z));}
  const midCurve=new THREE.CatmullRomCurve3(midPts);
  leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(midCurve,60,0.18,6,false),veinSurfMat));

  // Secondary veins
  for(let i=0;i<10;i++){
    const t=(i+0.5)/10;const mpt=midCurve.getPoint(t);const side=(i%2===0)?1:-1;
    const pts=[];const len=4+Math.random();
    for(let j=0;j<=16;j++){const f=j/16;const sx=mpt.x+f*len*0.3;const sz=mpt.z+side*f*len*0.85;pts.push(new THREE.Vector3(sx,surfaceY(sx,sz)+0.04*(1-f*0.5),sz));}
    const c=new THREE.CatmullRomCurve3(pts);
    leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(c,20,0.1,5,false),veinSubMat));
    // Tertiary veinlets from secondaries
    for(let j=1;j<=2;j++){const bt=j/3;const bp=c.getPoint(bt);const ss=(j%2===0)?1:-1;
      const sp=[bp.clone(),new THREE.Vector3(bp.x+0.5,surfaceY(bp.x+0.5,bp.z+ss*0.8)+0.025,bp.z+ss*0.8),new THREE.Vector3(bp.x+1.0,surfaceY(bp.x+1.0,bp.z+ss*1.4)+0.02,bp.z+ss*1.4)];
      leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(sp),10,0.04,4,false),veinFineMat));
    }
  }
  // Reticulate fine network
  for(let x=-9;x<=9;x+=2.5)for(let z=-4;z<=4;z+=2.0){
    if(Math.random()>0.3){const px=x+(Math.random()-0.5)*1.5;const pz=z+(Math.random()-0.5)*1.2;const ex=px+1+Math.random()*1.5;const ez=pz+(Math.random()-0.5)*1.8;
      leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(px,surfaceY(px,pz)+0.02,pz),new THREE.Vector3((px+ex)/2,surfaceY((px+ex)/2,(pz+ez)/2)+0.015,(pz+ez)/2),new THREE.Vector3(ex,surfaceY(ex,ez)+0.012,ez)]),8,0.03,4,false),veinFineMat));}
    if(Math.random()>0.5){const px=x+(Math.random()-0.5);const pz=z+(Math.random()-0.5);const ex=px+(Math.random()-0.5)*1.2;const ez=pz+1+Math.random();
      leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(px,surfaceY(px,pz)+0.015,pz),new THREE.Vector3(ex,surfaceY(ex,ez)+0.012,ez)]),6,0.022,4,false),veinFineMat));}
  }
})();

// ═══ TRICHOMES ═══
(function(){
  const stemMat=new THREE.MeshPhysicalMaterial({color:0x7a9a60,roughness:0.5,transparent:true,opacity:0.8});
  const headMat=new THREE.MeshPhysicalMaterial({color:0x8aaa6a,roughness:0.3,transparent:true,opacity:0.85});
  const jointMat=new THREE.MeshPhysicalMaterial({color:0x5a7a40,roughness:0.4});
  const hairMat=new THREE.MeshPhysicalMaterial({color:0x95b578,roughness:0.55,transparent:true,opacity:0.75});

  function addGlandular(bx,bz){
    const by=surfaceY(bx,bz);const sn=surfaceNormal(bx,bz);
    const lx=(Math.random()-0.5)*0.3,lz=(Math.random()-0.5)*0.3;
    const dir=new THREE.Vector3(sn.x+lx,sn.y,sn.z+lz).normalize();
    const totalH=0.18+Math.random()*0.22;const segs=2;const segH=totalH/segs;
    const baseR=0.018+Math.random()*0.008;
    let cx=bx,cy=by,cz=bz;
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),dir);
    for(let s=0;s<segs;s++){
      const t=s/segs;const r0=baseR*(1-t*0.3);const r1=baseR*(1-(t+1/segs)*0.3);
      const seg=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,segH,4),stemMat);
      seg.position.set(cx+dir.x*segH*0.5,cy+dir.y*segH*0.5,cz+dir.z*segH*0.5);seg.quaternion.copy(q);leafGroup.add(seg);
      if(s<segs-1){const j=new THREE.Mesh(new THREE.TorusGeometry(r1*1.3,0.004,3,6),jointMat);
        j.position.set(cx+dir.x*segH,cy+dir.y*segH,cz+dir.z*segH);
        const jq=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),dir);j.quaternion.copy(jq);leafGroup.add(j);}
      cx+=dir.x*segH;cy+=dir.y*segH;cz+=dir.z*segH;
    }
    const hr=0.03+Math.random()*0.015;
    const head=new THREE.Mesh(new THREE.SphereGeometry(hr,6,4),headMat);
    head.position.set(cx+dir.x*hr*0.3,cy+dir.y*hr*0.3,cz+dir.z*hr*0.3);head.scale.set(1.3,0.5,1.3);head.quaternion.copy(q);leafGroup.add(head);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(baseR*1.2,baseR*1.8,0.02,5),jointMat);
    base.position.set(bx,by+0.005,bz);const bq=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),sn);base.quaternion.copy(bq);leafGroup.add(base);
  }

  function addSimple(bx,bz){
    const by=surfaceY(bx,bz);const sn=surfaceNormal(bx,bz);
    const lx=(Math.random()-0.5)*0.45,lz=(Math.random()-0.5)*0.45;
    const dir=new THREE.Vector3(sn.x+lx,sn.y,sn.z+lz).normalize();
    const h=0.12+Math.random()*0.35;const pts=[];const n=6;
    const cm=0.03+Math.random()*0.05,cd=Math.random()*Math.PI*2;
    for(let i=0;i<=n;i++){const t=i/n;const bend=t*t*cm;
      pts.push(new THREE.Vector3(bx+dir.x*h*t+Math.cos(cd)*bend,by+dir.y*h*t,bz+dir.z*h*t+Math.sin(cd)*bend));}
    leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),n,0.008,4,false),hairMat));
  }

  // Dense grid — much smaller spacing for many more trichomes
  for(let x=-9.5;x<=9.5;x+=0.45)for(let z=-4.5;z<=4.5;z+=0.45){
    if(Math.random()>0.15){
      const px=x+(Math.random()-0.5)*0.35,pz=z+(Math.random()-0.5)*0.35;
      if(Math.random()<0.2) addGlandular(px,pz); else addSimple(px,pz);
    }
  }
  // Extra scattered fill
  for(let i=0;i<120;i++){const px=(Math.random()-0.5)*19,pz=(Math.random()-0.5)*9;
    if(Math.random()<0.25) addGlandular(px,pz); else addSimple(px,pz);}
})();

// ═══ PALISADE MESOPHYLL ═══
for(let x=-9;x<=9;x+=1.1)for(let z=-4;z<=4;z+=1.1){
  const h=2.8+Math.random()*0.6,r=0.35+Math.random()*0.1;
  const cell=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.9,h,8),palisadeMat);
  const px=x+Math.random()*0.4-0.2,pz=z+Math.random()*0.4-0.2;
  cell.position.set(px,4.8-h/2-0.3,pz);cell.castShadow=true;leafGroup.add(cell);
  for(let c=0;c<2+Math.floor(Math.random()*3);c++){const cm=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,4),chloroMat);const a=Math.random()*Math.PI*2;
    cm.position.set(px+Math.cos(a)*r*0.6,cell.position.y+(Math.random()-0.5)*h*0.7,pz+Math.sin(a)*r*0.6);cm.scale.set(1,0.5,1);leafGroup.add(cm);}
}

// ═══ SPONGY MESOPHYLL ═══
for(let x=-9;x<=9;x+=2.5)for(let z=-4;z<=4;z+=2.5){
  for(let y=0.1;y<=2.8;y+=1.5){if(Math.random()>0.35){const r=0.45+Math.random()*0.35;
    const cell=new THREE.Mesh(new THREE.SphereGeometry(r,7,5),spongyMat);cell.position.set(x+(Math.random()-0.5)*1.8,y+(Math.random()-0.5)*0.7,z+(Math.random()-0.5)*1.8);
    cell.scale.set(1+Math.random()*0.5,0.6+Math.random()*0.4,1+Math.random()*0.5);leafGroup.add(cell);
    if(Math.random()>0.5){const cm=new THREE.Mesh(new THREE.SphereGeometry(0.09,5,4),chloroMat);cm.position.copy(cell.position);cm.position.x+=(Math.random()-0.5)*r*0.5;cm.scale.set(1,0.5,1);leafGroup.add(cm);}}}
  if(Math.random()>0.4){const am=new THREE.Mesh(new THREE.SphereGeometry(0.5+Math.random()*0.4,6,4),airMat);am.position.set(x+(Math.random()-0.5)*1.5,0.1+Math.random()*2.7,z+(Math.random()-0.5)*1.5);leafGroup.add(am);}
}

// Internal vein bundle
const vp=new THREE.CatmullRomCurve3([new THREE.Vector3(-10,1.5,0),new THREE.Vector3(-4,1.3,0.5),new THREE.Vector3(0,1.2,0),new THREE.Vector3(4,1.3,-0.3),new THREE.Vector3(10,1.5,0)]);
leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(vp,32,0.35,8,false),veinMat));
for(let i=0;i<4;i++){const t=0.2+i*0.2,pt=vp.getPoint(t),d=i%2===0?1:-1;leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([pt,new THREE.Vector3(pt.x+1,pt.y+0.2,pt.z+d*2),new THREE.Vector3(pt.x+2,pt.y+0.3,pt.z+d*4)]),12,0.15,6,false),veinMat));}

// ═══ LOWER EPIDERMIS ═══
(function(){const geo=new THREE.PlaneGeometry(LW,LD,60,30);const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getY(i);pos.setXYZ(i,x,-0.2+0.05*Math.sin(x*0.3)*Math.cos(z*0.4),z);}geo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:0x4a7a28,roughness:0.45,transparent:true,opacity:0.85,side:THREE.DoubleSide})));})();
for(let i=0;i<10;i++){const sx=-8+Math.random()*16,sz=-3.5+Math.random()*7;for(let side=-1;side<=1;side+=2){const g=new THREE.Mesh(new THREE.TorusGeometry(0.25,0.08,6,12,Math.PI),new THREE.MeshPhysicalMaterial({color:0x3a7a20,roughness:0.4}));g.position.set(sx,-0.5,sz);g.rotation.x=Math.PI/2;g.rotation.z=side>0?0:Math.PI;g.scale.set(1,1,0.6);leafGroup.add(g);}}
(function(){const geo=new THREE.PlaneGeometry(LW,LD,40,20);const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getY(i);pos.setXYZ(i,x,BOTTOM_Y+0.03*Math.sin(x*0.3)*Math.cos(z*0.4),z);}geo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(geo,cuticleMat));})();

// ═══ SUN ═══
const sunPos=new THREE.Vector3(-4,16,0);
tmp=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,16),new THREE.MeshBasicMaterial({color:T.sun}));tmp.position.copy(sunPos);leafGroup.add(tmp);
leafGroup.add(new THREE.Mesh(new THREE.RingGeometry(1.0,1.5,24),new THREE.MeshBasicMaterial({color:T.sun,transparent:true,opacity:0.25,side:THREE.DoubleSide})));
leafGroup.children[leafGroup.children.length-1].position.copy(sunPos);

// ═══ SPECULAR REFLECTION — CONE OF SCATTERED RAYS ═══
const specX=6,specZ=0;
const specHitY=surfaceY(specX,specZ);
const specHit=new THREE.Vector3(specX,specHitY,specZ);
const incDir=specHit.clone().sub(sunPos).normalize();

// Incoming ray
leafGroup.add(createArrow(sunPos.clone().add(incDir.clone().multiplyScalar(1.5)),specHit,T.sun,0.06,0.22,0.6));

// Use vertical normal (straight up)
const localNorm=new THREE.Vector3(0,1,0);
const refDir=incDir.clone().sub(localNorm.clone().multiplyScalar(2*incDir.dot(localNorm))).normalize();
const peakLen=9;
const refEnd=specHit.clone().add(refDir.clone().multiplyScalar(peakLen));

// Peak ray
leafGroup.add(createArrow(specHit,refEnd,T.specPeak,0.07,0.25,0.65));

// Normal (dashed) — vertical
const nLen=7.5,nEnd=specHit.clone().add(localNorm.clone().multiplyScalar(nLen));
(function(){const pts=[];for(let i=0;i<=60;i++)pts.push(specHit.clone().lerp(nEnd,i/60));
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineDashedMaterial({color:T.normalHex,dashSize:0.4,gapSize:0.2,transparent:true,opacity:0.8}));l.computeLineDistances();leafGroup.add(l);})();
leafGroup.add(createArrow(specHit.clone().add(localNorm.clone().multiplyScalar(nLen-0.8)),nEnd,T.normalHex,0.035,0.14,0.55));

// Angle arcs & labels
const incAngle=Math.acos(Math.abs(incDir.dot(localNorm)));
(function(){
  const inPlaneDir=incDir.clone().sub(localNorm.clone().multiplyScalar(incDir.dot(localNorm))).normalize();
  const ipts=[];for(let i=0;i<=50;i++){const f=i/50,a=f*incAngle;const d=localNorm.clone().multiplyScalar(Math.cos(a)).add(inPlaneDir.clone().multiplyScalar(-Math.sin(a)));ipts.push(specHit.clone().add(d.multiplyScalar(4)));}
  leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ipts),50,0.07,5,false),new THREE.MeshBasicMaterial({color:T.sun})));
  const refInPlane=refDir.clone().sub(localNorm.clone().multiplyScalar(refDir.dot(localNorm))).normalize();
  const rpts=[];for(let i=0;i<=50;i++){const f=i/50,a=f*incAngle;const d=localNorm.clone().multiplyScalar(Math.cos(a)).add(refInPlane.clone().multiplyScalar(Math.sin(a)));rpts.push(specHit.clone().add(d.multiplyScalar(4)));}
  const rc=new THREE.CatmullRomCurve3(rpts);
  leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(rc,50,0.07,5,false),new THREE.MeshBasicMaterial({color:T.specPeak})));
  const ic=new THREE.CatmullRomCurve3(ipts);
  const im=ic.getPoint(0.5),rm=rc.getPoint(0.5);
  leafGroup.add(mkCL('αᵢ',new THREE.Vector3(im.x-1.8,im.y+0.3,im.z),T.sunLabel,90));
  leafGroup.add(mkCL('αᵣ',new THREE.Vector3(rm.x+1.8,rm.y+0.3,rm.z),T.specPeakLabel,90));
})();

function mkCL(text,pos,color,fontSize){
  fontSize=fontSize||80;const cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=256;cv.height=128;cx.clearRect(0,0,256,128);
  cx.shadowColor=T.labelShadow;cx.shadowBlur=14;cx.font='bold '+fontSize+'px serif';cx.fillStyle=color;cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(text,128,64);cx.fillText(text,128,64);cx.fillText(text,128,64);cx.shadowBlur=0;cx.fillText(text,128,64);
  const t2=new THREE.CanvasTexture(cv);t2.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t2,transparent:true,depthTest:false}));s.position.copy(pos);s.scale.set(3.5,1.75,1);return s;
}
leafGroup.add(mkCL('n̂',new THREE.Vector3(specHit.x+0.8,nEnd.y+1,specHit.z),T.normal,75));

// ═══ TRANSPARENT CONE ENVELOPE + RAYS INSIDE ═══
(function(){
  const origin=specHit.clone();
  const peakD=refDir.clone();
  const tangent=new THREE.Vector3(),bitangent=new THREE.Vector3();
  if(Math.abs(peakD.y)<0.99) tangent.crossVectors(UP,peakD).normalize();
  else tangent.crossVectors(new THREE.Vector3(1,0,0),peakD).normalize();
  bitangent.crossVectors(peakD,tangent).normalize();

  const coneHalfAngle=22*Math.PI/180;
  const rayLen=peakLen*0.95;

  // ── CONE ENVELOPE ──
  // Build as custom triangle-fan mesh: apex → base circle
  const cRes=48;
  const cBaseR=rayLen*Math.tan(coneHalfAngle);
  const cCenter=origin.clone().add(peakD.clone().multiplyScalar(rayLen));

  // Lateral surface
  const verts=[],idx=[];
  verts.push(origin.x,origin.y,origin.z); // apex = vertex 0
  for(let i=0;i<=cRes;i++){
    const phi=(i/cRes)*Math.PI*2;
    const pt=cCenter.clone().add(tangent.clone().multiplyScalar(cBaseR*Math.cos(phi))).add(bitangent.clone().multiplyScalar(cBaseR*Math.sin(phi)));
    verts.push(pt.x,pt.y,pt.z);
    if(i>0) idx.push(0,i,i+1);
  }
  const cGeo=new THREE.BufferGeometry();
  cGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  cGeo.setIndex(idx);
  cGeo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(cGeo,new THREE.MeshBasicMaterial({color:T.coneLobe,transparent:true,opacity:0.06,side:THREE.DoubleSide,depthWrite:false})));

  // Slightly brighter inner cone at ~50% half-angle
  const iR=cBaseR*0.5;const iv=[origin.x,origin.y,origin.z],ii=[];
  for(let i=0;i<=cRes;i++){const phi=(i/cRes)*Math.PI*2;const pt=cCenter.clone().add(tangent.clone().multiplyScalar(iR*Math.cos(phi))).add(bitangent.clone().multiplyScalar(iR*Math.sin(phi)));iv.push(pt.x,pt.y,pt.z);if(i>0) ii.push(0,i,i+1);}
  const iGeo=new THREE.BufferGeometry();iGeo.setAttribute('position',new THREE.Float32BufferAttribute(iv,3));iGeo.setIndex(ii);iGeo.computeVertexNormals();
  leafGroup.add(new THREE.Mesh(iGeo,new THREE.MeshBasicMaterial({color:T.coneLobe,transparent:true,opacity:0.04,side:THREE.DoubleSide,depthWrite:false})));

  // Longitudinal edge ribs on cone surface
  for(let i=0;i<16;i++){
    const phi=(i/16)*Math.PI*2;
    const endPt=cCenter.clone().add(tangent.clone().multiplyScalar(cBaseR*Math.cos(phi))).add(bitangent.clone().multiplyScalar(cBaseR*Math.sin(phi)));
    const pts=[origin.clone(),origin.clone().lerp(endPt,0.5),endPt];
    leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),12,0.01,4,false),new THREE.MeshBasicMaterial({color:T.coneLobe,transparent:true,opacity:0.09,depthWrite:false})));
  }

  // Cross-section rings at distances along cone
  [0.3,0.55,0.8,1.0].forEach(d=>{
    const dist=rayLen*d;const r=dist*Math.tan(coneHalfAngle);const rc=origin.clone().add(peakD.clone().multiplyScalar(dist));
    const pts=[];for(let i=0;i<=64;i++){const phi=(i/64)*Math.PI*2;pts.push(rc.clone().add(tangent.clone().multiplyScalar(r*Math.cos(phi))).add(bitangent.clone().multiplyScalar(r*Math.sin(phi))));}
    leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),64,0.02,4,true),new THREE.MeshBasicMaterial({color:T.coneLobe,transparent:true,opacity:0.07+d*0.05,depthWrite:false})));
  });

  // ── SCATTERED RAYS INSIDE CONE ──
  const rings=[
    {af:0.12,n:3,th:0.045,hr:0.15,hl:0.38,op:0.9},
    {af:0.3, n:5,th:0.038,hr:0.12,hl:0.32,op:0.7},
    {af:0.5, n:6,th:0.03, hr:0.10,hl:0.28,op:0.5},
    {af:0.7, n:7,th:0.024,hr:0.08,hl:0.24,op:0.33},
    {af:0.9, n:8,th:0.018,hr:0.06,hl:0.20,op:0.18},
  ];
  rings.forEach(r=>{
    const theta=coneHalfAngle*r.af;
    for(let i=0;i<r.n;i++){
      const phi=(i/r.n)*Math.PI*2+r.af*1.1;
      const dir=new THREE.Vector3().addScaledVector(peakD,Math.cos(theta)).addScaledVector(tangent,Math.sin(theta)*Math.cos(phi)).addScaledVector(bitangent,Math.sin(theta)*Math.sin(phi)).normalize();
      if(dir.y<0.05) return;
      const len=rayLen*(0.75+0.25*Math.cos(theta));
      const endPt=origin.clone().add(dir.clone().multiplyScalar(len));
      const c=new THREE.Color(T.specPeak).lerp(new THREE.Color(T.spec),r.af);
      const arrow=createArrow(origin,endPt,c,r.th,r.hr,r.hl);
      arrow.traverse(ch=>{if(ch.material){ch.material.transparent=true;ch.material.opacity=r.op;}});
      leafGroup.add(arrow);
    }
  });
})();

// Extra incoming rays
[new THREE.Vector3(4,surfaceY(4,1),1),new THREE.Vector3(8,surfaceY(8,-1),-1)].forEach(hit=>{
  const iDir=hit.clone().sub(sunPos).normalize();
  leafGroup.add(createArrow(sunPos.clone().add(iDir.clone().multiplyScalar(1.5)),hit,T.sun,0.04,0.15,0.4));
});

// ═══ INTERNAL SCATTERING ═══
[[[-5,4.8,0],[-4.2,3.8,0.6]],[[-4.2,3.8,0.6],[-5,3.0,0.2]],[[-5,3.0,0.2],[-4.5,2.0,-0.3]],[[0,4.5,0],[0.6,3.5,0.5]],[[0.6,3.5,0.5],[-0.2,2.5,0.2]],[[-0.2,2.5,0.2],[0.4,1.5,-0.3]],[[-8,4.8,1.5],[-7.5,3.5,1.2]],[[-7.5,3.5,1.2],[-8,2.5,0.8]],[[7,4.8,-1],[6.5,3.5,-0.5]],[[6.5,3.5,-0.5],[7,2.3,0]]].forEach(([s,e])=>{leafGroup.add(createArrow(new THREE.Vector3(...s),new THREE.Vector3(...e),T.scatter,0.03,0.1,0.28));});
[[-4.2,3.8,0.6],[-5,3.0,0.2],[0.6,3.5,0.5],[-0.2,2.5,0.2]].forEach(p=>{const d=new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6),new THREE.MeshBasicMaterial({color:T.scatter}));d.position.set(...p);leafGroup.add(d);});

// Refraction
[{i:[[-2,4.8,1],[-2,4.2,1]],o:[[-1.7,4.2,1],[-1.3,3.3,0.8]]},{i:[[2,3.2,-0.5],[2,2.8,-0.5]],o:[[2.3,2.8,-0.5],[2.8,2.2,-0.3]]},{i:[[-4,2.5,0.5],[-4,2.0,0.5]],o:[[-3.6,2.0,0.5],[-3.2,1.3,0.3]]},{i:[[4,3.5,-1.5],[4,3.0,-1.5]],o:[[4.3,3.0,-1.5],[4.6,2.2,-1.2]]}].forEach(({i:inp,o:out})=>{leafGroup.add(createArrow(new THREE.Vector3(...inp[0]),new THREE.Vector3(...inp[1]),T.refract,0.035,0.1,0.25));leafGroup.add(createArrow(new THREE.Vector3(...out[0]),new THREE.Vector3(...out[1]),T.refract,0.035,0.1,0.25));const bd=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),new THREE.MeshBasicMaterial({color:T.refract}));bd.position.set(...inp[1]);leafGroup.add(bd);});

// Absorption
[[[-3,4.0,0.5],[-3,3.2,0.5]],[[2.5,3.8,-0.3],[2.5,3.0,-0.3]],[[5,2.5,0.5],[5,1.8,0.5]],[[-5,3.5,1],[-5,2.8,1]],[[0,2.0,0],[0,1.3,0]]].forEach(([s,e])=>{leafGroup.add(createFadingArrow(new THREE.Vector3(...s),new THREE.Vector3(...e),T.absorb));});

// ═══ LABELS ═══
function makeLabel(text,pos,color,fontSize){
  fontSize=fontSize||72;const cv=document.createElement('canvas'),cx=cv.getContext('2d');cv.width=1024;cv.height=192;cx.clearRect(0,0,1024,192);
  cx.shadowColor=T.labelShadow;cx.shadowBlur=10;cx.font='bold '+fontSize+'px "Segoe UI", sans-serif';cx.fillStyle=color||'#222';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(text,512,96);cx.shadowBlur=0;cx.fillText(text,512,96);
  const t2=new THREE.CanvasTexture(cv);t2.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t2,transparent:true,depthTest:false}));s.position.copy(pos);s.scale.set(12,2.4,1);return s;
}
leafGroup.add(makeLabel('Cuticle (waxy)',new THREE.Vector3(14,5.8,0),T.layerColors[0],56));
leafGroup.add(makeLabel('Upper Epidermis',new THREE.Vector3(16,5.0,0),T.layerColors[1],56));
leafGroup.add(makeLabel('Palisade Mesophyll',new THREE.Vector3(16.5,3.5,0),T.layerColors[2],56));
leafGroup.add(makeLabel('Spongy Mesophyll',new THREE.Vector3(16,1.5,0),T.layerColors[3],56));
leafGroup.add(makeLabel('Lower Epidermis',new THREE.Vector3(16,-0.2,0),T.layerColors[4],56));
leafGroup.add(makeLabel('Specular Reflection',new THREE.Vector3(6,14,0),T.specLabel,76));

// ═══ CAMERA ═══
let isDown=false,isRight=false,prevX=0,prevY=0,theta=0.5,phi=0.82,radius=44,panX=1,panY=5.0;
function updateCamera(){camera.position.x=radius*Math.sin(phi)*Math.cos(theta)+panX;camera.position.y=radius*Math.cos(phi)+panY;camera.position.z=radius*Math.sin(phi)*Math.sin(theta);camera.lookAt(panX,panY,0);}
updateCamera();
function renderOnce(){renderer.render(scene,camera);}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0)isDown=true;if(e.button===2)isRight=true;prevX=e.clientX;prevY=e.clientY;});
renderer.domElement.addEventListener('mousemove',e=>{if(isDown){theta-=(e.clientX-prevX)*0.005;phi=Math.max(0.2,Math.min(Math.PI-0.2,phi+(e.clientY-prevY)*0.005));updateCamera();renderOnce();}if(isRight){panX-=(e.clientX-prevX)*0.03;panY+=(e.clientY-prevY)*0.03;updateCamera();renderOnce();}prevX=e.clientX;prevY=e.clientY;});
window.addEventListener('mouseup',()=>{isDown=false;isRight=false;});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
renderer.domElement.addEventListener('wheel',e=>{radius=Math.max(12,Math.min(70,radius+e.deltaY*0.03));updateCamera();renderOnce();});
let ts=null,tsd=null;
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1)ts={x:e.touches[0].clientX,y:e.touches[0].clientY};else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;tsd=Math.sqrt(dx*dx+dy*dy);}});
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1&&ts){theta-=(e.touches[0].clientX-ts.x)*0.005;phi=Math.max(0.2,Math.min(Math.PI-0.2,phi+(e.touches[0].clientY-ts.y)*0.005));ts={x:e.touches[0].clientX,y:e.touches[0].clientY};updateCamera();renderOnce();}else if(e.touches.length===2&&tsd){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);radius=Math.max(12,Math.min(70,radius-(d-tsd)*0.05));tsd=d;updateCamera();renderOnce();}},{passive:false});
renderOnce();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);renderOnce();});
}
</script>
